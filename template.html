<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- هذه الوسوم ستُملأ آلياً لكل دومين -->
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="https://whois-lookup.github.io/domain/{{DOMAIN}}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="website">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "{{DOMAIN}} WHOIS & Security Audit",
      "url": "https://whois-lookup.github.io/domain/{{DOMAIN}}",
      "description": "{{DESCRIPTION}}"
    }
    </script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .box { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
        h1 { font-size: 1.6rem; color: #38bdf8; margin-bottom: 1rem; }
        p { color: #94a3b8; line-height: 1.6; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
        .data-table td { padding: 0.75rem; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

<div class="box">
    <h1>Audit Report: {{DOMAIN}}</h1>
    <p>{{DESCRIPTION}}</p>
    
    <table class="data-table">
        <tr><td><strong>Domain:</strong></td><td>{{DOMAIN}}</td></tr>
        <tr><td><strong>DNS Status:</strong></td><td id="dnsStatus">Active / Operational</td></tr>
        <tr><td><strong>Security Level:</strong></td><td style="color:#4ade80;">Protected</td></tr>
    </table>
</div>

<script>
    // جلب بيانات الـ DNS لايف عبر متصفح الزائر
    fetch(`https://dns.google/resolve?name={{DOMAIN}}&type=A`)
    .then(r => r.json())
    .then(data => {
        if(data.Answer) {
            document.getElementById('dnsStatus').innerText = 'IP: ' + data.Answer[0].data;
        }
    }).catch(()=>{});
</script>

</body>
</html>
